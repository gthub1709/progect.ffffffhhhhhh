<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Руслан Юлдашев — Учитель Космоса</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
      background: black;
      color: #00ffe5;
    }

    /* Новый фон */
    .background-planet {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://images.unsplash.com/photo-1473921628311-6be2f7bba36e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80') no-repeat center center;
      background-size: cover;
      opacity: 0.2;
      z-index: -2;
      filter: brightness(0.8) saturate(1.2);
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 100px 20px;
    }

    h1 {
      font-size: 3em;
      text-shadow: 0 0 30px #00ffe5;
      animation: glow 2s infinite alternate;
    }

    .message {
      font-size: 1.4em;
      opacity: 0;
      transition: opacity 2s ease;
      margin-top: 40px;
    }

    h2 {
      font-size: 2em;
      color: #ffcc00;
      text-shadow: 0 0 20px #ffcc00;
    }

    button {
      background: #00ffe5;
      border: none;
      padding: 15px 30px;
      font-size: 1em;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      color: black;
      box-shadow: 0 0 15px #00ffe5;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #00ffe5; }
      to { text-shadow: 0 0 40px #00ffe5, 0 0 80px #00ffe5; }
    }

    /* 👽 Тайное инопланетное сообщение */
    .alien-signal {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 1.2em;
      color: lime;
      opacity: 0;
      animation: blink 10s infinite;
      z-index: 1;
      text-shadow: 0 0 10px lime, 0 0 20px green;
    }

    @keyframes blink {
      0%, 98%, 100% { opacity: 0; }
      5%, 10% { opacity: 1; }
    }
  </style>
</head>
<body>

<canvas id="stars"></canvas>
<canvas id="fireworks"></canvas>
<div class="background-planet"></div>

<div class="content">
  <h1>Руслан Юлдашев 🚀</h1>
  <p>Учитель, сияющий ярче звёзд</p>
  <button onclick="launchShow()">✨ Запуск шоу</button>

  <div class="message" id="surpriseMessage">
    <p>Руслан Юлдашев — не просто учитель. Он вдохновляет, ведёт, заряжает энергией знаний и верой в будущее.</p>
    <p>Под его руководством мы растём — не только как специалисты, но и как личности.</p>
    <h2>Спасибо, Руслан ака, вы — самый лучшый!</h2>
  </div>
</div>

<!-- 👽 Тайная изюминка -->
<div class="alien-signal">👽 Привет, земляне...</div>

<audio id="bgMusic" loop>
  <source src="https://www.bensound.com/bensound-music/bensound-epic.mp3" type="audio/mp3">
</audio>

<script>
  // === Звёзды ===
  const starsCanvas = document.getElementById("stars");
  const ctx = starsCanvas.getContext("2d");
  starsCanvas.width = window.innerWidth;
  starsCanvas.height = window.innerHeight;

  const stars = Array.from({length: 150}, () => ({
    x: Math.random() * starsCanvas.width,
    y: Math.random() * starsCanvas.height,
    r: Math.random() * 1.5 + 0.5,
    d: Math.random() * 0.5 + 0.05
  }));

  function drawStars() {
    ctx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
    ctx.fillStyle = "#00ffe5";
    ctx.beginPath();
    for (let s of stars) {
      ctx.moveTo(s.x, s.y);
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    }
    ctx.fill();
    for (let s of stars) {
      s.y += s.d;
      if (s.y > starsCanvas.height) {
        s.y = 0;
        s.x = Math.random() * starsCanvas.width;
      }
    }
  }
  setInterval(drawStars, 33);

  // === Музыка ===
  const audio = document.getElementById("bgMusic");
  function playMusic() {
    if (audio.paused) audio.play();
  }

  // === Эффекты запуска ===
  const msg = document.getElementById("surpriseMessage");

  function launchShow() {
    flashEffect();
    playMusic();
    setTimeout(() => {
      msg.style.opacity = 1;
    }, 3000);
    setTimeout(() => {
      launchFireworks();
    }, 6000);
  }

  // === Световая вспышка ===
  function flashEffect() {
    const flash = document.createElement("div");
    flash.style.position = "fixed";
    flash.style.top = 0;
    flash.style.left = 0;
    flash.style.width = "100%";
    flash.style.height = "100%";
    flash.style.background = "radial-gradient(circle, white, transparent 70%)";
    flash.style.zIndex = 2;
    flash.style.opacity = 1;
    flash.style.transition = "opacity 1.5s ease-out";
    document.body.appendChild(flash);
    setTimeout(() => {
      flash.style.opacity = 0;
      setTimeout(() => document.body.removeChild(flash), 1500);
    }, 100);
  }

  // === Фейерверк ===
  const fwCanvas = document.getElementById("fireworks");
  const fctx = fwCanvas.getContext("2d");
  fwCanvas.width = window.innerWidth;
  fwCanvas.height = window.innerHeight;
  const particles = [];

  function random(min, max) {
    return Math.random() * (max - min) + min;
  }

  function launchFireworks() {
    for (let i = 0; i < 80; i++) {
      particles.push({
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        vx: random(-5, 5),
        vy: random(-5, 5),
        alpha: 1,
        radius: random(1, 3),
        color: `hsl(${random(0, 360)}, 100%, 50%)`
      });
    }
  }

  function drawFireworks() {
    fctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
    fctx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);
    for (let p of particles) {
      fctx.beginPath();
      fctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      fctx.fillStyle = `rgba(${p.color.match(/\d+/g).join(',')}, ${p.alpha})`;
      fctx.fill();
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.015;
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      if (particles[i].alpha <= 0) particles.splice(i, 1);
    }
    requestAnimationFrame(drawFireworks);
  }

  drawFireworks();
</script>

</body>
</html>
